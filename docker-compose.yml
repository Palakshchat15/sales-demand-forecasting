version: "3.8"

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: airflow/Dockerfile
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    POSTGRES_DB: ${POSTGRES_DB}
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
    KAFKA_TOPIC: ${KAFKA_TOPIC}
    GROQ_API_KEY: ${GROQ_API_KEY}
    OPENAI_API_KEY: ${OPENAI_API_KEY}
    OLLAMA_MODEL: ${OLLAMA_MODEL}
    OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
    # Optional experiment tracking (logging only): the training script logs here after it has
    # written its outputs, and only warns if the mlflow service is stopped or unreachable.
    MLFLOW_TRACKING_URI: http://mlflow:5000
    # Host path of data/processed, recorded in the Tableau workbook as the source for "Refresh Extract"
    TABLEAU_DATA_DIR: ${HOST_PROJECT_DIR}/data/processed
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./data:/opt/airflow/data
    - ./dbt:/opt/airflow/dbt
    - ./src:/opt/airflow/src
    - ./outputs:/opt/airflow/outputs
    - ./tableau:/opt/airflow/tableau
    - ./great_expectations:/opt/airflow/great_expectations
    - ./kafka:/opt/airflow/kafka
    - ./spark:/opt/airflow/spark
    - //var/run/docker.sock:/var/run/docker.sock
  user: "0:0"
  extra_hosts:
    - "host.docker.internal:host-gateway"
    # Fixed IPs (see networks: at the end): resolve without Docker's embedded DNS, which failed intermittently
    - "postgres:172.28.0.10"
    - "kafka:172.28.0.11"
    - "spark-master:172.28.0.12"
    - "mlflow:172.28.0.13"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres_init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    command: >
      postgres -c max_connections=200
    networks:
      default:
        ipv4_address: 172.28.0.10

  postgres-init-airflow-db:
    image: postgres:15
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    entrypoint: >
      bash -c "psql -h postgres -U ${POSTGRES_USER} -d ${POSTGRES_DB} -tc \"SELECT 1 FROM pg_database WHERE datname = 'airflow'\" | grep -q 1 ||
      psql -h postgres -U ${POSTGRES_USER} -d ${POSTGRES_DB} -c \"CREATE DATABASE airflow\""

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc -w 2 localhost 2181 | grep -q Mode || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.5.3
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9094:9094"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      default:
        ipv4_address: 172.28.0.11
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15

  spark-master:
    image: apache/spark:3.5.9-scala2.12-java11-python3-r-ubuntu
    container_name: sales_spark_master
    # The driver advertises this hostname to the executor; with the fixed IP and extra_hosts below,
    # neither side needs Docker's DNS.
    hostname: spark-master
    user: root
    networks:
      default:
        ipv4_address: 172.28.0.12
    extra_hosts:
      - "postgres:172.28.0.10"
      - "spark-master:172.28.0.12"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        /opt/spark/sbin/start-master.sh --host 0.0.0.0 --port 7077 --webui-port 8080
        tail -f /opt/spark/logs/*.out
    ports:
      - "8081:8080"
      - "7077:7077"
    volumes:
      - ./spark:/opt/spark_jobs
      - ./spark/jars:/opt/spark/extra-jars
      # Delta Lake tables (bronze/silver/gold); the same host folder on master (driver: commits
      # the _delta_log) and worker (executor: writes the Parquet files). Gitignored.
      - ./data/lakehouse:/opt/lakehouse
      # Lakehouse parity / demo reports (written by the driver only)
      - ./results:/opt/results
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  spark-worker:
    image: apache/spark:3.5.9-scala2.12-java11-python3-r-ubuntu
    container_name: sales_spark_worker
    user: root
    extra_hosts:
      - "postgres:172.28.0.10"
      - "spark-master:172.28.0.12"
    depends_on:
      - spark-master
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        /opt/spark/sbin/start-worker.sh spark://spark-master:7077 --cores 2 --memory 2G
        tail -f /opt/spark/logs/*.out
    volumes:
      - ./spark:/opt/spark_jobs
      - ./spark/jars:/opt/spark/extra-jars
      - ./data/lakehouse:/opt/lakehouse

  # MLflow tracking server + model registry (logging only; UI http://localhost:5003).
  # SQLite metadata store and artifact store both on the mlflow_data volume; clients upload
  # artifacts through the server (--artifacts-destination), so no shared folder is needed.
  # One gunicorn worker and a 512 MB cap keep it small.
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.2
    command: >
      mlflow server --host 0.0.0.0 --port 5000 --workers 1
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
    ports:
      - "5003:5000"
    volumes:
      - mlflow_data:/mlflow
    mem_limit: 512m
    networks:
      default:
        ipv4_address: 172.28.0.13
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  airflow-init:
    <<: *airflow-common
    depends_on:
      postgres-init-airflow-db:
        condition: service_completed_successfully
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8082:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  pg_data:
  mlflow_data:

# Fixed subnet so postgres / kafka / spark-master / mlflow keep the IPs used in extra_hosts above.
networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16
